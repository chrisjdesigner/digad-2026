  #dev-layout-wrapper {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #dev-layout-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #dev-ad-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow-x: auto;
    overflow-y: auto;
    padding: 20px;
    box-sizing: border-box;
    scrollbar-gutter: stable both-edges;
    background: var(--dev-ad-content-bg);
    position: relative;
  }

  #dev-ad-content > * {
    flex-shrink: 0;
    margin-left: auto;
    margin-right: auto;
  }

  #dev-layout-wrapper.is-all-view #dev-ad-content {
    align-items: flex-start;
    justify-content: flex-start;
    padding: 0;
  }

  #dev-layout-wrapper.is-all-view #dev-ad-content > * {
    margin-left: 0;
    margin-right: 0;
    min-width: 100%;
  }

  .dev-preview-stage {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-start;
    gap: 10px;
    max-width: none;
    flex-shrink: 0;
    padding: 24px;
  }

  .dev-preview-ad-shell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    max-width: none;
    flex-shrink: 0;
    position: relative;
    background: var(--dev-bg-secondary, #181819);
    box-shadow: 0 4px 12px var(--dev-shadow, rgba(0, 0, 0, 0.3));
  }

  .dev-preview-ad-shell > :not(.dev-preview-loading) {
    max-width: none;
    flex-shrink: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.22s ease;
  }

  .dev-preview-ad-shell.is-ready > :not(.dev-preview-loading) {
    opacity: 1;
    visibility: visible;
  }

  .dev-preview-actions {
    display: flex;

  #dev-settings-tray {
    position: relative;
    width: var(--sidebar-width, 340px);
    min-width: 370px;
    max-width: 600px;
    height: 100vh;
    flex-shrink: 0;
    background: var(--dev-bg-primary);
    border-left: 1px solid var(--dev-border);
    font-family: var(--dev-ui-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  
  #dev-settings-tray .sidebar-resize-handle {
    position: absolute;
    top: 0;
    left: -1px;
    width: 2px;
    height: 100%;
    cursor: col-resize;
    z-index: 999999;
  }
  
  #dev-settings-tray .sidebar-resize-handle:hover,
  #dev-settings-tray .sidebar-resize-handle.dragging {
    background: var(--dev-resize-active);
    opacity: 1;
  }

  #dev-settings-tray .tray-content {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  /* Tabs */
  #dev-settings-tray .sidebar-tabs {
    display: flex;
    background: var(--dev-bg-primary);
    border-bottom: 1px solid var(--dev-border);
    flex-shrink: 0;
  }

  #dev-settings-tray .sidebar-tab {
    flex: 0 0 50%;
    padding: 17px 12px;
    background: var(--dev-bg-primary);
    border: none;
    color: var(--dev-text-faint);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 0;
    white-space: nowrap;
  }

  #dev-settings-tray .sidebar-tab:first-of-type {
    border-right: 1px solid var(--dev-border);
  }

  #dev-settings-tray .sidebar-tab .sidebar-tab-icon {
    width: 14px;
    height: 14px;
    fill: currentColor;
    flex-shrink: 0;
  }

  #dev-settings-tray .sidebar-tab .sidebar-tab-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #dev-settings-tray .sidebar-tab:hover {
    color: var(--dev-text-secondary);
    background: var(--dev-bg-hover);
  }

  #dev-settings-tray .sidebar-tab.active {
    color: var(--dev-text-secondary);
    background: var(--dev-bg-section);
  }

  #dev-settings-tray .sidebar-tab-panel {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  #dev-settings-tray .sidebar-tab-panel.active {
    display: flex;
  }

  #dev-settings-tray .sidebar-vars-loading {
    display: none;
    flex: 1;
    background: var(--dev-bg-section);
    min-height: 100%;
  }

  #dev-settings-tray.vars-loading .sidebar-tab-panel[data-panel="variables"] .tray-content,
  #dev-settings-tray.vars-loading .sidebar-tab-panel[data-panel="variables"] .sync-notice {
    visibility: hidden;
  }

  #dev-settings-tray.vars-loading .sidebar-tab-panel[data-panel="variables"].active .sidebar-vars-loading {
    display: flex;
  }

  /* Project tab */
  #dev-settings-tray .project-fields {
    display: flex;
    flex-direction: column;
    gap: 17px;
    padding: 0;
  }

  #dev-settings-tray .project-section {
    padding: 0;
  }

  #dev-settings-tray .project-field {
    padding: 0;
  }

  #dev-settings-tray .project-toggle-field {
    margin-top: 2px;
  }

  #dev-settings-tray .project-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  #dev-settings-tray .project-toggle-label {
    margin-bottom: 0;
    flex: 1;
    line-height: 1.3;
    cursor: pointer;
  }

  #dev-settings-tray .project-toggle-row .theme-switch {
    flex-shrink: 0;
  }

  #dev-settings-tray .project-toggle-row .theme-switch input:focus-visible ~ .theme-switch-track {
    outline: 2px solid var(--dev-accent);
    outline-offset: 2px;
    border-color: var(--dev-accent);
  }

  #dev-settings-tray .project-field-label {
    display: block;
    color: var(--dev-text-dimmed);
    font-size: 10px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  #dev-settings-tray .project-field-input-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #dev-settings-tray .project-field-input {
    flex: 1;
    background: var(--dev-bg-input);
    border: 1px solid var(--dev-border-input);
    border-radius: 8px;
    color: var(--dev-text-primary);
    padding: 7px 10px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  #dev-settings-tray .project-field-input:hover {
    border-color: var(--dev-border-hover);
  }

  #dev-settings-tray .project-field-input:focus {
    outline: none;
    border-color: var(--dev-accent);
  }

  #dev-settings-tray .project-field-input::placeholder {
    color: var(--dev-text-faint);
  }

  #dev-settings-tray .project-field-edit {
    background: transparent;
    border: none;
    padding: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.3;
    transition: opacity 0.2s;
  }

  #dev-settings-tray .project-field-edit:hover {
    opacity: 1;
  }

  #dev-settings-tray .project-field-edit svg {
    width: 14px;
    height: 14px;
    stroke: var(--dev-text-muted);
  }

  #dev-settings-tray .project-field-edit:hover svg {
    stroke: var(--dev-text-primary);
  }

  /* Project list items (ad sizes, versions) */
  #dev-settings-tray .project-list {
    padding: 0;
  }

  #dev-settings-tray .project-list-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  #dev-settings-tray .project-list-item.active .project-list-item-link {
    background: var(--dev-bg-hover);
    border: 1px solid var(--dev-border);
  }

  #dev-settings-tray .project-list-item.active .project-list-item-link {
    color: var(--dev-text-primary);
  }

  #dev-settings-tray .project-list-item-link {
    flex: 1;
    color: var(--dev-text-muted);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    padding: 7px 15px;
    border-radius: 9999px;
    display: block;
    transition: all 0.15s;
  }

  #dev-settings-tray .project-list-item-link:hover {
    color: var(--dev-text-primary);
  }

  #dev-settings-tray .project-list-item-link:focus-visible {
    outline: 2px solid var(--dev-accent);
    outline-offset: 2px;
    color: var(--dev-text-primary);
    background: var(--dev-bg-hover);
  }

  #dev-settings-tray .project-list-item-action {
    background: transparent;
    border: none;
    padding: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.3;
    transition: opacity 0.15s;

    color: var(--dev-text-primary);
    padding: 8px 10px;
    font-size: 12px;
    font-family: inherit;
  }

  .dev-modal-size-field {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .dev-modal-size-input {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 33px;
  }

  .dev-modal-size-field.open .dev-modal-size-input {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    border-color: var(--dev-border-hover);
  }

  .dev-modal-size-suggestions {
    display: none;
    position: absolute;
    top: calc(100% - 1px);
    left: 0;
    right: 0;
    z-index: 10;
    border: 1px solid var(--dev-border-input);
    border-top: none;
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
    background: var(--dev-bg-input);
    max-height: 180px;
    overflow-y: auto;
  }

  .dev-modal-size-field.open .dev-modal-size-suggestions {
    display: block;
    border-color: var(--dev-border-hover);
  }

  .dev-modal-size-suggestion {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    border-top: 1px solid var(--dev-border);
    color: var(--dev-text-muted);
    text-align: left;
    padding: 8px 10px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }

  .dev-modal-size-suggestion:first-child {
    border-top: none;
  }

  .dev-modal-size-suggestion:hover,
  .dev-modal-size-suggestion.active {
    background: var(--dev-bg-hover);
    color: var(--dev-text-secondary);
  }

  .dev-modal-input:focus {
    outline: none;
    border-color: var(--dev-accent);
  }

  .dev-modal-error {
    min-height: 0;
    color: var(--dev-danger);
    font-size: 11px;
  }

  .dev-modal-error:empty {
    display: none;
  }

  .dev-modal-footer {
    display: flex;
    justify-content: flex-end;
    padding-top: 20px;
    gap: 8px;
    border-top: 1px solid var(--dev-border);
  }

  .dev-modal-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9999px;
    color: var(--dev-text-dimmed);
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .dev-modal-btn:hover {
    color: var(--dev-text-secondary);
    text-decoration: underline;
  }

  .dev-modal-btn-primary {
    border-color: var(--dev-primary-action);
    color: var(--dev-primary-action);
  }

  .dev-modal-btn-primary:hover {
    border-color: var(--dev-primary-action);
    color: white;
    background: var(--dev-primary-action);
    text-decoration: none;
  }

  .dev-modal-btn-danger {
    border-color: var(--dev-danger);
    color: var(--dev-danger);
  }

  .dev-modal-btn-danger:hover {
    border-color: var(--dev-danger);
    color: white;
    background: var(--dev-danger);
    text-decoration: none;
  }

  .dev-modal-btn:focus-visible {
    outline: 1px solid var(--dev-border-input);
    outline-offset: 2px;
  }

  .dev-modal-btn-danger:focus-visible {
    outline-color: var(--dev-danger);
  }
