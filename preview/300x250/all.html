      <script>
        
  (() => {
    const revealCard = (card) => {
      if (card.dataset.previewReady === '1') return;
      card.dataset.previewReady = '1';

      // Delay reveal slightly to avoid a flash of unstyled frame content.
      window.setTimeout(() => {
        card.classList.add('is-ready');
      }, 140);
    };

    const setCardLoading = (card) => {
      card.dataset.previewReady = '0';
      card.classList.remove('is-ready');
    };

    const appendReplayToken = (src) => {
      if (!src) return src;
      const token = '_replay=' + Date.now();
      return src.includes('?') ? src + '&' + token : src + '?' + token;
    };

    const bindPreviewLoading = () => {
      document.querySelectorAll('.version-card').forEach((card) => {
        if (card.dataset.previewBound === '1') return;
        card.dataset.previewBound = '1';

        const frame = card.querySelector('iframe');
        if (!frame) return;

        const replayBtn = card.querySelector('.version-replay-btn');

        const baseSrc = frame.dataset.previewSrc || frame.getAttribute('src') || '';

        frame.addEventListener('load', () => {
          requestAnimationFrame(() => revealCard(card));
        });

        frame.addEventListener('error', () => {
          revealCard(card);
        });

        if (replayBtn && baseSrc) {
          replayBtn.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            setCardLoading(card);
            frame.setAttribute('src', appendReplayToken(baseSrc));
          });
        }

        try {
          if (frame.contentDocument?.readyState === 'complete') {
            revealCard(card);
          }
        } catch {
          // Ignore cross-document access while frame is navigating.
        }
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bindPreviewLoading, { once: true });
    } else {
      bindPreviewLoading();
    }
  })();

      <script>
    (() => {
      const STORAGE_PREFIX = 'dev-all-view-section-';

      const sectionKey = (section, index) => {
        const size = section.getAttribute('data-size-group');
        if (size) return STORAGE_PREFIX + size;

        const title = section.querySelector('.size-group-title');
        const fallback = (title?.textContent || '').trim() || String(index + 1);
        return STORAGE_PREFIX + fallback;
      };

      const applyExpandedState = (section, title, expanded) => {
        section.classList.toggle('collapsed', !expanded);
        title.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      };

      const toggleSection = (section, title, key) => {
        const nextExpanded = section.classList.contains('collapsed');
        applyExpandedState(section, title, nextExpanded);
        localStorage.setItem(key, nextExpanded ? 'open' : 'collapsed');
      };

      const setupGroupedAccordion = () => {
        const sections = Array.from(document.querySelectorAll('.grid.grouped .size-group'));

        sections.forEach((section, index) => {
          const title = section.querySelector('.size-group-title');
          if (!title) return;

          const key = sectionKey(section, index);
          const savedState = localStorage.getItem(key);

          title.setAttribute('role', 'button');
          title.setAttribute('tabindex', '0');

          if (savedState === 'collapsed') {
            applyExpandedState(section, title, false);
          } else {
            applyExpandedState(section, title, true);
          }

          title.addEventListener('click', () => {
            toggleSection(section, title, key);
          });

          title.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            toggleSection(section, title, key);
          });
        });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupGroupedAccordion, { once: true });
      } else {
        setupGroupedAccordion();
      }
    })();
  </script>

  function getSizeHref(currentAd, newSize) {
    if (newSize === 'all') {
      return getAllAdsHref(currentAd);
    }

    return currentAd === 'all'
      ? `./${newSize}/all.html`
      : `../${newSize}/all.html`;
  }

  function getVersionHref(newVersion) {
    if (newVersion === 'all') {
      return './all.html';
    }

    if (newVersion) {
      return `./${newVersion}.html`;
    }

    return './index.html';
  }

  function createToolbar() {
    try {
      const adConfigs = window.__DEV_AD_CONFIGS__ || [];
      const currentAd = window.__DEV_CURRENT_AD__ || 'all';
      const currentVariant = window.__DEV_CURRENT_VARIANT__ || null;
      const savedTheme = getSavedTheme();
      const isDark = savedTheme === 'dark';

      document.documentElement.setAttribute('data-dev-theme', savedTheme);

      if (document.getElementById('dev-toolbar')) {
        releasePendingLayout();
        return;
      }

      const toolbar = document.createElement('div');
      toolbar.id = 'dev-toolbar';
      toolbar.innerHTML = `
        <style>${toolbarStyles}</style>
        <div class="toolbar-group toolbar-brand" aria-label="SR logo">
          <a class="toolbar-brand-logo" href="${currentAd === 'all' ? './all.html' : '../all.html'}" title="View all ads">${srLogoIcon}</a>
        </div>
        <div class="toolbar-group">
          <select id="dev-size-select">
            ${adConfigs.map((ad) => `<option value="${ad.name}" ${ad.name === currentAd ? 'selected' : ''}>${ad.name}</option>`).join('')}
            <option value="all" ${currentAd === 'all' ? 'selected' : ''}>All</option>
          </select>
        </div>
        ${currentAd !== 'all' ? `
        <div class="toolbar-group">
          <select id="dev-version-select"></select>
        </div>
        ` : ''}
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group">
          <label class="theme-switch" title="Toggle light/dark mode">
            <input type="checkbox" id="dev-theme-toggle" ${isDark ? '' : 'checked'}>
            <span class="theme-switch-track">
              <span class="theme-switch-thumb">
                <span class="theme-switch-icon theme-switch-icon--sun">${sunIcon}</span>
                <span class="theme-switch-icon theme-switch-icon--moon">${moonIcon}</span>
              </span>
            </span>
          </label>
        </div>
      `;

      document.body.insertBefore(toolbar, document.body.firstChild);

      const sizeSelect = document.getElementById('dev-size-select');
      const versionSelect = document.getElementById('dev-version-select');
      const toggleCheckbox = document.getElementById('dev-theme-toggle');

      if (toggleCheckbox) {
        toggleCheckbox.addEventListener('change', () => {
          const next = toggleCheckbox.checked ? 'light' : 'dark';
          document.documentElement.setAttribute('data-dev-theme', next);
          localStorage.setItem(THEME_STORAGE_KEY, next);
        });
      }

      function updateVersionOptions(adName) {
        if (!versionSelect) return;

        if (adName === 'all') {
          versionSelect.style.display = 'none';
          return;
        }

        versionSelect.style.display = '';

        const ad = adConfigs.find((entry) => entry.name === adName);
        const variants = ad?.variants || [];

        versionSelect.innerHTML = `
          <option value="">Base</option>
          ${variants.map((variant) => `<option value="${variant}" ${variant === currentVariant ? 'selected' : ''}>${variant}</option>`).join('')}
          <option value="all" ${currentVariant === 'all' ? 'selected' : ''}>All</option>
        `;
      }

      updateVersionOptions(currentAd);

      if (sizeSelect) {
        sizeSelect.addEventListener('change', () => {
          window.location.href = getSizeHref(currentAd, sizeSelect.value);
        });
      }

      if (versionSelect) {
        versionSelect.addEventListener('change', () => {
          window.location.href = getVersionHref(versionSelect.value);
        });
      }

      releasePendingLayout();
    } catch (error) {
      console.error('Preview toolbar error:', error);
      releasePendingLayout();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', createToolbar, { once: true });
  } else {
    createToolbar();
  }
})();
</script>

      <div class="grid grouped">

      </div>
